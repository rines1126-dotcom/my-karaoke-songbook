name: Build MY KARAOKE SONGBOOK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q MyKaraokeSongbook.zip -d extracted

      - name: Fix app Gradle file
        run: |
          cat > extracted/MyKaraokeSongbook/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rines.mykaraokesongbook"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.rines.mykaraokesongbook"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/MyKaraokeSongbook
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-KARAOKE-SONGBOOK-APK
          path: extracted/MyKaraokeSongbook/app/build/outputs/apk/debug/*.apk
